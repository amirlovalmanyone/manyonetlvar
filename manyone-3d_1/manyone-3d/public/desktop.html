<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A001B'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />

<style>
  :root{ --ink:#0A001B; --muted:#9793a1; --hair:#eceaf0; }
  *{box-sizing:border-box}
  html,body{ height:100%; margin:0 }
  body{ background:#fff; color:var(--ink); overflow:hidden; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .stage{ display:flex; width:100vw; height:100vh; }

  .desktop{ position:relative; flex:1 1 auto; min-width:0; display:flex; flex-direction:column; background:#fff; }
  .d-head{ padding:26px 34px; z-index:5; }
  .d-head .logo{ height:24px; color:var(--ink); display:inline-block; cursor:pointer; }
  .d-head .logo svg{ height:100%; width:auto; display:block; }
  .d-view{ flex:1; position:relative; min-height:0; }
  .d-foot{ height:96px; display:flex; align-items:center; justify-content:center; z-index:5; }

  .btn{ appearance:none; cursor:pointer; font-family:inherit; font-size:14px; font-weight:500; padding:14px 34px; border-radius:999px; background:var(--ink); color:#fff; border:1.5px solid var(--ink); white-space:nowrap; transition:opacity .15s; }
  .btn:hover{ opacity:.86; }
  .btn[disabled]{ opacity:.5; cursor:default; }

  model-viewer{ width:100%; height:100%; background:#fff; --poster-color:#fff; outline:none; display:block; }

  .loader{ position:absolute; inset:0; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; transition:opacity .5s; z-index:8; }
  .loader.hide{ opacity:0; pointer-events:none; }
  .loader .logo{ height:34px; color:var(--ink); }
  .loader .logo svg{ height:100%; width:auto; }
  .loader .bar2{ width:120px; height:2px; background:#eee; border-radius:2px; overflow:hidden; position:relative; }
  .loader .bar2::after{ content:''; position:absolute; left:-40%; top:0; height:100%; width:40%; background:var(--ink); animation:sl 1.1s ease-in-out infinite; }
  @keyframes sl{ to{ left:100% } }

  .drop{ position:absolute; inset:16px; border:1.5px dashed #c9c4d4; border-radius:20px; display:none; align-items:center; justify-content:center; color:var(--muted); font-size:15px; background:rgba(255,255,255,.6); z-index:9; }
  .drop.on{ display:flex; }

  /* phone side panel */
  .phone-side{ flex:none; width:0; overflow:hidden; background:#f5f4f7; border-left:1px solid var(--hair);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; transition:width .55s cubic-bezier(.22,.61,.36,1); }
  .phone-side.open{ width:min(50vw,500px); }
  .phone{ height:min(70vh,560px); aspect-ratio:302/616; background:#0A001B; border-radius:44px; padding:11px; box-shadow:0 24px 60px rgba(10,0,27,.22); flex:none; }
  .pscreen{ position:relative; height:100%; border-radius:34px; overflow:hidden; background:#fff; }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:22px; background:#0A001B; border-radius:0 0 14px 14px; z-index:12; }
  .p-head{ position:absolute; top:26px; left:0; right:0; display:flex; justify-content:center; z-index:7; opacity:0; transition:opacity .5s; }
  .p-head.in{ opacity:1; }
  .p-head .logo{ height:16px; color:var(--ink); }
  .p-head .logo svg{ height:100%; width:auto; display:block; }
  .ar{ position:absolute; left:50%; transform:translateX(-50%); bottom:26px; z-index:9; display:inline-flex; align-items:center; gap:8px; background:var(--ink); color:#fff; border:0; cursor:pointer; font:inherit; font-weight:600; font-size:14px; padding:12px 30px; border-radius:999px; box-shadow:0 8px 24px rgba(10,0,27,.22); opacity:0; transition:opacity .5s; }
  .ar.in{ opacity:1; }
  .ar svg{ width:17px; height:17px; }

  /* real link + QR block */
  .linkcard{ width:min(46vw,420px); background:#fff; border:1px solid var(--hair); border-radius:16px; padding:16px 18px; text-align:center; box-shadow:0 12px 34px rgba(10,0,27,.08); }
  .linkcard h3{ font-size:13px; font-weight:600; margin:0 0 10px; }
  .linkcard .qr{ width:120px; height:120px; margin:0 auto 12px; }
  .linkcard .qr svg{ width:100%; height:100%; display:block; }
  .linkrow{ display:flex; gap:6px; align-items:center; border:1px solid var(--hair); border-radius:9px; padding:5px 5px 5px 12px; }
  .linkrow input{ flex:1; border:0; outline:0; font:inherit; font-size:12px; color:var(--ink); background:none; min-width:0; }
  .cp{ border:0; background:var(--ink); color:#fff; font:inherit; font-weight:600; font-size:11px; padding:7px 12px; border-radius:7px; cursor:pointer; }
  .cp.done{ background:#1a8f4c; }
  .linkcard .note{ font-size:11px; color:var(--muted); margin:10px 0 0; }
</style>
